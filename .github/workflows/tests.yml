# Получаем текущую версию Google Chrome
  CHROME_VERSION=$(google-chrome --version | sed 's/Google Chrome //' | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
echo "Detected Chrome version: ${CHROME_VERSION}"

# Если версия не соответствует формату, используем рабочую версию (например, 116.0.5845.96)
  if [[ ! "$CHROME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
echo "Invalid Chrome version detected: ${CHROME_VERSION}. Using fallback version 116.0.5845.96."
  CHROME_VERSION="116.0.5845.96"
  fi
  
  # Получаем последнюю совместимую версию ChromeDriver
  CHROMEDRIVER_VERSION=$(curl -sS "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")
  
  # Проверяем, что версия была корректно извлечена
  if [ -z "$CHROMEDRIVER_VERSION" ]; then
echo "Error: Unable to find compatible ChromeDriver version for Chrome ${CHROME_VERSION}. Using fallback version."
  CHROMEDRIVER_VERSION="116.0.5845.96"  # Используем стабильную версию ChromeDriver
  fi
  
  # Скачиваем и устанавливаем ChromeDriver
  wget https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
  unzip chromedriver_linux64.zip
  sudo mv chromedriver /usr/local/bin/
  sudo chmod +x /usr/local/bin/chromedriver
