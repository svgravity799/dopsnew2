name: Test Workflow

on:
  push:
    branches:
      - main

jobs:
  install-chrome-driver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip google-chrome-stable

      - name: Get and install ChromeDriver
        run: |
          # Получаем текущую версию Google Chrome
          CHROME_VERSION=$(google-chrome --version | sed 's/Google Chrome //' | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "Detected Chrome version: ${CHROME_VERSION}"
          
          # Получаем последнюю совместимую версию ChromeDriver с правильным API запросом
          CHROMEDRIVER_VERSION=$(curl -sS "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}" || echo "116.0.5845.96")
          
          # Проверяем, что версия была корректно извлечена
          if [ -z "$CHROMEDRIVER_VERSION" ]; then
            echo "Error: Unable to find compatible ChromeDriver version for Chrome ${CHROME_VERSION}. Using fallback version."
            CHROMEDRIVER_VERSION="116.0.5845.96" # fallback версия
          fi
          
          echo "Using ChromeDriver version: ${CHROMEDRIVER_VERSION}"
          
          # Скачиваем и устанавливаем ChromeDriver
          wget https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          echo "ChromeDriver ${CHROMEDRIVER_VERSION} installed successfully."

      - name: Run tests
        run: |
          ./gradlew test
