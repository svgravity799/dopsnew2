name: Run UI Tests on macOS (manual trigger only)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Homebrew and Google Chrome
        run: |
          # Установка Homebrew, если отсутствует
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> ~/.zprofile
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi
          brew install --cask google-chrome

      - name: Get Chrome major version
        id: get_version
        run: |
          FULL_VERSION=$("/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Full version: $FULL_VERSION"
          MAJOR_VERSION=$(echo "$FULL_VERSION" | cut -d. -f1)
          echo "Major version: $MAJOR_VERSION"
          echo "version=$MAJOR_VERSION" >> $GITHUB_OUTPUT

      - name: Download matching ChromeDriver
        run: |
          JSON_URL="https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          curl -s $JSON_URL > chrome_versions.json
          echo "Content of chrome_versions.json:"
          head -40 chrome_versions.json

          echo "Available versions:"
          jq '.channels.Stable.downloads.chromedriver[].version' chrome_versions.json

          DRIVER_URL=$(jq -r --arg ver "${{ steps.get_version.outputs.version }}" '
            .channels.Stable.downloads.chromedriver[]
            | select((.version | tostring) | startswith($ver))
            | .url
          ' chrome_versions.json)

          echo "Downloading ChromeDriver from $DRIVER_URL"
          curl -sSL $DRIVER_URL -o chromedriver.zip
          unzip chromedriver.zip
          sudo mv chromedriver-mac-arm64/chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version

      - name: Run UI Tests
        run: ./gradlew clean test --tests LoginInBag
