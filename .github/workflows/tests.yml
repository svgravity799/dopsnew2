name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          ./gradlew build # Устанавливаем все зависимости из build.gradle

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb > google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb
          sudo apt-get -y install -f

      - name: Install ChromeDriver
        run: |
          CHROME_VERSION=$(google-chrome --version | sed 's/Google Chrome //' | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
          echo "Detected Chrome version: ${CHROME_VERSION}"

          # Получаем последнюю совместимую версию ChromeDriver
          CHROMEDRIVER_VERSION=$(curl -sS "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")

          # Проверяем, что версия была корректно извлечена
          if [ -z "$CHROMEDRIVER_VERSION" ]; then
            echo "ChromeDriver version not found, using fallback version 116.0.5845.96."
            CHROMEDRIVER_VERSION="116.0.5845.96" # fallback версия
          fi

          # Скачиваем и устанавливаем ChromeDriver
          wget https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          echo "ChromeDriver ${CHROMEDRIVER_VERSION} installed successfully."

      - name: Run tests
        run: ./gradlew test
