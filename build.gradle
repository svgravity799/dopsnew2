plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Selenide
    testImplementation 'com.codeborne:selenide:7.5.0'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    // Allure
    testImplementation 'io.qameta.allure:allure-selenide:2.27.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.27.0'

    // WebDriverManager — автоматическая подстановка ChromeDriver
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.9.2'

    // Telegram API (если используешь)
    testImplementation 'org.telegram:telegrambots:6.8.0'
}

test {
    useJUnitPlatform()
    systemProperty "file.encoding", "UTF-8"

    // Чтобы Allure репорты собирались
    testLogging {
        events "passed", "skipped", "failed"
    }
}

allure {
    version = "2.27.0"
    useJUnit5 {
        version = "2.27.0"
    }
}
